# Runs automatically on `git commit`. Run on everything manually: uv run pre-commit run --all-files

# Third-party files are kept exactly as published, so no hook may modify them.
exclude: ^static/vendor/

repos:
  # --- Generic file hygiene checks ---------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

# --- Our own tools, run through uv so they use the versions pinned in uv.lock -----
  - repo: local
    hooks:
      # --force-exclude: pre-commit passes files by name, and without this flag ruff would
      # ignore the excludes in pyproject.toml (e.g. generated migrations).
      - id: ruff-check
        name: ruff (lint)
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff (format)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy (type check)
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
