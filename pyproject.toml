[project]
name = "job-search-organizer"
version = "0.1.0"
description = "Personal, local-first Django app to organize a job search"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-cotton>=2.9.0",
    "django-environ>=0.14.0",
    "django-tailwind-cli>=4.10.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

# --- ruff: linter + formatter -------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors and warnings
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: sorted, grouped imports
    "N",       # pep8-naming: naming conventions
    "UP",      # pyupgrade: use modern Python syntax
    "B",       # flake8-bugbear: likely bugs and design problems
    "S",       # flake8-bandit: security issues
    "DJ",      # flake8-django: Django-specific best practices
    "C4",      # flake8-comprehensions: cleaner comprehensions
    "SIM",     # flake8-simplify: simpler code
    "PTH",     # flake8-use-pathlib: pathlib instead of os.path
    "RUF",     # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# S101: plain `assert` is how pytest tests are written.
# S105/S106: test users need made-up passwords; these are not real secrets.
"tests/**" = ["S101", "S105", "S106"]

# --- mypy: static type checker -------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main"]
disallow_untyped_defs = true     # every function needs type hints
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
exclude = ['migrations/', '\.venv/']  # regular expressions

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["environ.*"]          # django-environ ships without type information
ignore_missing_imports = true

# --- pytest: test runner -------------------------------------------------------------
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--strict-markers"
