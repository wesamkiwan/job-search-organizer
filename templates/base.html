{% load static tailwind_cli %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Search Organizer{% endblock title %}</title>
    {# Set the theme before anything is drawn (prevents a white flash in dark mode). #}
    <script>
      (function () {
        let theme = null;
        try { theme = localStorage.getItem("theme"); } catch {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    {% tailwind_css %}
    <script src="{% static 'js/theme.js' %}" defer></script>
  </head>
  <body class="min-h-screen antialiased">
    <header class="border-b border-line bg-surface">
      <div class="mx-auto flex max-w-3xl items-center justify-between px-6 py-3">
        <a href="{% url 'core:home' %}" class="font-semibold tracking-tight">Job Search Organizer</a>

        <button type="button" data-theme-toggle aria-pressed="false"
                class="inline-flex size-9 items-center justify-center rounded-md border border-line text-ink-muted hover:bg-surface-muted hover:text-ink">
          <span class="sr-only">Dark mode</span>
          {# Icons: Feather Icons (MIT). Moon shows in light mode, sun in dark mode. #}
          <svg class="size-4 dark:hidden" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="hidden size-4 dark:block" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
      </div>
    </header>
    {% block content %}{% endblock content %}
  </body>
</html>
