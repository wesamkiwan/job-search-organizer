{% comment %}
Message box for errors, warnings and confirmations.
Usage: <c-alert tone="danger">Please enter a correct username and password.</c-alert>
tone: info | success | warning | danger
role="alert" makes screen readers announce danger/warning messages immediately.
{% endcomment %}
<c-vars tone="info" class="" />
<div {% if tone == "danger" or tone == "warning" %}role="alert"{% else %}role="status"{% endif %}
     class="rounded-md px-3 py-2.5 text-sm
       {% if tone == "success" %}bg-success-soft text-success
       {% elif tone == "warning" %}bg-warning-soft text-warning
       {% elif tone == "danger" %}bg-danger-soft text-danger
       {% else %}bg-info-soft text-info{% endif %}
       {{ class }}" {{ attrs }}>
  {{ slot }}
</div>
