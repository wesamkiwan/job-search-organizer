{% comment %}
Shown where a list has no items yet: says what will appear and offers the next step.
Usage:
  <c-empty-state icon="briefcase-business" title="No applications yet"
                 description="Add your first application to start tracking it.">
    <c-button>Add application</c-button>
  </c-empty-state>
{% endcomment %}
<c-vars title description="" icon="" />
<div class="flex flex-col items-center rounded-lg border border-dashed border-line-strong px-6 py-12 text-center">
  {% if icon %}
    <div class="grid size-10 place-items-center rounded-md bg-surface-muted text-ink-muted">
      <c-icon :name="icon" class="size-5" />
    </div>
  {% endif %}
  <h3 class="mt-3 font-semibold tracking-tight">{{ title }}</h3>
  {% if description %}<p class="mt-1 max-w-sm text-sm text-ink-muted">{{ description }}</p>{% endif %}
  {% if slot %}<div class="mt-5">{{ slot }}</div>{% endif %}
</div>
