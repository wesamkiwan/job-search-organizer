{# Light/dark toggle button. The logic lives in static/js/theme.js (it looks for data-theme-toggle). #}
<button type="button" data-theme-toggle aria-pressed="false"
        class="inline-flex size-9 items-center justify-center rounded-md text-ink-muted hover:bg-surface-muted hover:text-ink">
  <span class="sr-only">Dark mode</span>
  {# Moon shows in light mode, sun in dark mode. #}
  <c-icon name="moon" class="size-4 dark:hidden" />
  <c-icon name="sun" class="hidden size-4 dark:block" />
</button>
